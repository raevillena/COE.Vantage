# SPA fallback: serve index.html for any path that is not a static file.
# This lets the React app load so client-side routing (e.g. /dashboard) works
# when the user opens or refreshes a direct URL.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
